{% extends "base.html" %}

{% block title %}Список задач — Flask{% endblock %}

{% block content %}
    <h1>Список задач</h1>

    <form action="/" method="POST">
        <input type="text" name="title" placeholder="Введите новую задачу..." required>
        <button type="submit">Добавить</button>
    </form>

    <ul>
        {% for task in tasks %}
            <li>
                <span class="{{ 'done' if task.done else '' }}">
                    {{ task.title }}
                </span>
                <div class="actions">
                    <a href="{{ url_for('toggle_task', task_id=task.id) }}">
                        {{ 'Отменить' if task.done else 'Готово' }}
                    </a>
                    <a href="{{ url_for('delete_task', task_id=task.id) }}" style="color: red;">
                        Удалить
                    </a>
                </div>
            </li>
        {% else %}
            <li>Задач пока нет.</li>
        {% endfor %}
    </ul>
{% endblock %}
